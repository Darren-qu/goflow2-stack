global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: goflow2
    static_configs:
      - targets: ["goflow2:8080"]
  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["db:9363"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
