# GoFlow2 → Kafka → ClickHouse → Grafana
# Based on netsampler/goflow2 compose/kcg (adapted for standalone deploy)
#
# Public (all interfaces): UDP 2055/6343 (flows), TCP 3030 (Grafana)
# Localhost only:         8080 metrics, 8123/9000 ClickHouse, 9090 Prometheus,
#                         9093 Alertmanager
# Secrets:                copy .env.example → .env (never commit .env)

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_BROKER_ID: "1"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: IB
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,IB:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,BROKER://:9092,IB://:9094
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,IB://:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      # Partitions for auto-created topics (incl. "flows") — bounds how many
      # parallel ClickHouse consumers (kafka_num_consumers) can actually help.
      # Only affects topics created fresh; see README "Scaling ingestion".
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-3}"
      # Buffer only — ClickHouse is source of truth. Short retention saves disk.
      # If you change these, recreate kafka+goflow2+db together (not kafka alone).
      KAFKA_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS:-48}"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "300000"
      # Write logs to the named volume below instead of the image's default
      # /tmp/kafka-logs, which lives in the container's writable layer and
      # isn't visible to `docker volume`/host disk monitoring.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Application logs to stdout only (bounded by the json-file limits below).
      # The image default also writes hourly server.log.* files into the
      # container's writable layer and never deletes them.
      KAFKA_LOG4J_OPTS: "-Dlog4j2.configurationFile=/etc/kafka/log4j2-console.yaml"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka/log4j2-console.yaml:/etc/kafka/log4j2-console.yaml:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  goflow2:
    image: ghcr.io/netsampler/goflow2:v2.2.7
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "2055:2055/udp"           # NetFlow v5/v9 / IPFIX (must be reachable by exporters)
      - "6343:6343/udp"           # sFlow
      - "127.0.0.1:8080:8080"     # Prometheus metrics (localhost only)
    restart: unless-stopped
    command:
      - -transport=kafka
      - -transport.kafka.brokers=kafka:9092
      - -transport.kafka.topic=flows
      - -format=bin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    # 26.8 is an LTS line (patch releases for a year). Stay on LTS lines (.3 / .8).
    image: clickhouse/clickhouse-server:26.8-alpine
    environment:
      CLICKHOUSE_DO_NOT_CHOWN: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-flow}
      # Kafka engine consumer parallelism for the `flows` table (first init only —
      # see README "Scaling ingestion" to change it on an existing install).
      CH_KAFKA_NUM_CONSUMERS: "${CH_KAFKA_NUM_CONSUMERS:-3}"
      # Read-only account used by Grafana (clickhouse/users.d/grafana.xml)
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:-grafana-ro}
      # Share of host RAM ClickHouse may use (clickhouse/config.d/memory.xml)
      CH_MEMORY_RATIO: "${CH_MEMORY_RATIO:-0.6}"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP — localhost only
      - "127.0.0.1:9000:9000"   # native — localhost only
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d/
      - ./clickhouse/flow.proto:/var/lib/clickhouse/format_schemas/flow.proto:ro
      - ./clickhouse/protocols.csv:/var/lib/clickhouse/user_files/protocols.csv:ro
      - ./clickhouse/services.csv:/var/lib/clickhouse/user_files/services.csv:ro
      - ./clickhouse/config.d/logger.xml:/etc/clickhouse-server/config.d/logger.xml:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/config.d/system_logs.xml:/etc/clickhouse-server/config.d/system_logs.xml:ro
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ./clickhouse/users.d/grafana.xml:/etc/clickhouse-server/users.d/grafana.xml:ro
      - ch_data:/var/lib/clickhouse
      # The base image defaults to trace-level logging with no volume for its own
      # log dir, so the logs live in the container's writable layer — this filled
      # the host disk once already. Put them on a volume so they're visible to
      # `docker system df` and survive container recreation.
      - ch_logs:/var/log/clickhouse-server
    depends_on:
      kafka:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  grafana:
    image: grafana/grafana:13.1.10
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Used by datasources-ch.yml provisioning: Grafana queries ClickHouse as the
      # read-only "grafana" user, never as the admin "default" user.
      CLICKHOUSE_GRAFANA_PASSWORD: ${CLICKHOUSE_GRAFANA_PASSWORD:-grafana-ro}
      # Plugins pinned to exact versions (Altinity ClickHouse plugin, id still
      # vertamedia-*; Sankey remains unsigned). Bump deliberately, then test the
      # dashboards. Downloaded on first start of a new Grafana volume.
      GF_PLUGINS_PREINSTALL_SYNC: vertamedia-clickhouse-datasource@3.5.0,netsage-sankey-panel@1.1.4
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: netsage-sankey-panel
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Allow HTML <style> in Text panels (used so table IP text can be selected/copied)
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      # LDAP (edit ./grafana/ldap.toml). Local admin still works until you disable it.
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"
      # Optional after LDAP works: set to "false" to force LDAP-only logins
      # GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      # Grafana UI on host port 3030 (container listens on 3000)
      - "${GRAFANA_HOST_PORT:-3030}:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./grafana/datasources-ch.yml:/etc/grafana/provisioning/datasources/datasources-ch.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "127.0.0.1:9090:9090"   # UI/API — localhost only
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
      - node-exporter

  # Delivers Prometheus alerts (email / webhook). Receivers live in
  # ./alertmanager/alertmanager.yml (local, gitignored; created from the
  # .example by deploy.sh). Until you add a receiver, alerts are only visible
  # in the UI on http://127.0.0.1:9093.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    ports:
      - "127.0.0.1:9093:9093"   # UI/API — localhost only
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  # Host disk / memory metrics that do not depend on ClickHouse being alive
  # (a full disk kills ClickHouse first, taking its own disk metric with it).
  # Not published on the host; scraped inside the compose network.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.loadavg
      - --collector.cpu
      - --collector.netstat
      - --collector.uname
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /:/host:ro,rslave

volumes:
  alertmanager_data:
  ch_data:
  ch_logs:
  grafana_data:
  kafka_data:
  prometheus_data:
